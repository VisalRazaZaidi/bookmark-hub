<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bookmark Hub</title>
  <link rel="icon" href="icons/icon-32.png">
  <link rel="stylesheet" href="css/manager.css">
</head>
<body>
  <header class="top">
    <button class="icon-btn only-narrow" id="menuBtn" aria-label="Show folders" aria-expanded="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <a class="brand" href="manager.html" aria-label="Bookmark Hub">
      <svg viewBox="0 0 32 32" class="logo" aria-hidden="true">
        <rect width="32" height="32" rx="9" fill="var(--accent)"/>
        <path d="M10.5 7h11a1.5 1.5 0 0 1 1.5 1.5V25l-7-4.6L9 25V8.5A1.5 1.5 0 0 1 10.5 7z" fill="var(--accent-ink)"/>
      </svg>
      <span>Bookmark Hub</span>
    </a>

    <div class="search" role="search">
      <svg viewBox="0 0 24 24" class="s-ico" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4.5 4.5"/></svg>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Search by title, site or folder" aria-label="Search bookmarks">
      <kbd id="slash" aria-hidden="true">/</kbd>
      <button class="icon-btn small" id="clearQ" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
      <div class="hints" id="hints" aria-hidden="true">
        <span>Narrow it down</span>
        <button type="button" data-hint="site:">site:github.com</button>
        <button type="button" data-hint="folder:">folder:python</button>
        <button type="button" data-hint='"'>"exact phrase"</button>
        <button type="button" data-hint="-">-word</button>
      </div>
    </div>

    <div class="tools">
      <label class="sel"><span class="sr">Sort</span>
        <select id="sort">
          <option value="recent">Newest first</option>
          <option value="old">Oldest first</option>
          <option value="az">A to Z</option>
          <option value="za">Z to A</option>
        </select>
      </label>
      <label class="sel"><span class="sr">Group</span>
        <select id="group">
          <option value="folder">Group by folder</option>
          <option value="domain">Group by site</option>
          <option value="date">Group by month added</option>
          <option value="none">No grouping</option>
        </select>
      </label>
      <div class="seg" role="group" aria-label="Layout">
        <button id="vGrid" data-view="grid" aria-label="Cards" title="Cards">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></svg>
        </button>
        <button id="vList" data-view="list" aria-label="Compact list" title="Compact list">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
      <button class="icon-btn" id="settingsBtn" aria-label="Settings" aria-expanded="false" aria-controls="settings">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="side" id="side" aria-label="Folders and filters"></aside>
    <div class="scrim" id="scrim"></div>
    <main class="main" id="main">
      <div id="banner"></div>
      <div id="head" class="head"></div>
      <div id="results"></div>
      <div id="sentinel" class="sentinel" hidden></div>
    </main>
  </div>

  <div class="settings" id="settings" hidden>
    <h2>Settings</h2>
    <div class="row">
      <span>Theme</span>
      <div class="seg text" id="themeSeg" role="group" aria-label="Theme">
        <button data-theme-set="auto">Auto</button>
        <button data-theme-set="light">Light</button>
        <button data-theme-set="dark">Dark</button>
      </div>
    </div>
    <div class="row">
      <span>Open bookmarks in</span>
      <div class="seg text" id="openSeg" role="group" aria-label="Open bookmarks in">
        <button data-open-set="tab">New tab</button>
        <button data-open-set="same">This tab</button>
      </div>
    </div>
    <label class="row check">
      <span>Site icons<small>Loaded from Google's icon service. Turn off to keep your site list private.</small></span>
      <input type="checkbox" id="favToggle">
    </label>
    <div class="row col" id="previewRow">
      <span>Page previews<small id="previewState"></small></span>
      <div class="btns">
        <button class="btn" id="pvFetch">Fetch missing previews</button>
        <button class="btn ghost" id="pvClear">Clear cache</button>
        <button class="btn ghost" id="pvRevoke">Turn off</button>
      </div>
    </div>
    <div class="row col" id="importRow" hidden>
      <span>Preview mode<small>Not running as an extension, so showing a bookmarks file instead of live bookmarks.</small></span>
      <div class="btns"><button class="btn" id="importBtn">Choose bookmarks .html</button></div>
    </div>
  </div>

  <input type="file" id="file" accept=".html,.htm,text/html" hidden>
  <div class="toast" id="toast" role="status" aria-live="polite">
    <span id="toastText"></span>
    <button type="button" class="toast-act" id="toastUndo" hidden>Undo</button>
  </div>

  <script src="js/store.js"></script>
  <script src="js/data.js"></script>
  <script src="js/previews.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
